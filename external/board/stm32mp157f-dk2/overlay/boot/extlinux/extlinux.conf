menu title astro-clock boot (type 2 + Enter for the previous kernel)
timeout 20
default stm32mp157f-dk2-buildroot

label stm32mp157f-dk2-buildroot
  kernel /boot/zImage
  devicetree /boot/stm32mp157f-dk2.dtb
  append console=ttySTM0,115200 root=/dev/mmcblk0p4 rootwait

# Fallback kept by scripts/board/deploy-kernel. astro.boot=previous lets the
# script see that the board runs the fallback, so it never rotates a bad
# kernel over the last good one.
label previous
  kernel /boot/zImage.prev
  devicetree /boot/stm32mp157f-dk2.dtb.prev
  append console=ttySTM0,115200 root=/dev/mmcblk0p4 rootwait astro.boot=previous
